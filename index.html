<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Alert Tracker</title>
</head>
<body>

    <h1>Active Weather Alerts</h1>
    
    <div>
        <label for="state-input">Enter State Abbreviation:</label>
        <input type="text" id="state-input" placeholder="e.g. NY" maxlength="2">
        <button id="fetch-alerts">Get Alerts</button>
    </div>

    
    <div id="error-message" class="hidden"></div>
    <div id="alerts-display"></div>
    <script src="index.js"></script>
</body>
</html>
